<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>better-xitter settings</title>
    <style>
      body {
        min-width: 250px;
        font-size: 13px;
      }
      .hint {
        margin: 0 0 8px 0;
        color: #666;
        font-size: 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      label {
        display: inline-flex;
        align-items: center;
      }
      summary {
        padding: 4px 6px;
        margin: 4px 0;
        outline: 1px solid #ddd;
        border-radius: 4px;
      }
      hr {
        border: 0;
        border-top: 1px solid #ddd;
      }
      li > details > div {
        padding: 4px 0 0 0;
      }
      li {
        margin: 4px 0;
      }
      .child-list {
        margin: 4px 0 0 12px;
      }
      .child-list label {
        padding-left: 8px;
      }
      .is-disabled {
        opacity: 0.6;
      }
      .help-icon {
        display: inline-block;
        margin-left: 4px;
        cursor: help;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid #888;
        background-color: #f8f8f8;
        color: #333;
        font-size: 9px;
        line-height: 12px;
        text-align: center;
        vertical-align: text-bottom;
      }
    </style>
  </head>
  <body>
    <h2>Better Xitter</h2>
    <div id="root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
