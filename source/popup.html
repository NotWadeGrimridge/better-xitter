<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>better-xitter settings</title>
    <style>
      body {
        min-width: 200px;
      }
      .hint {
        margin: 0 0 8px 0;
        color: #666;
        font-size: 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .child-list {
        margin: 4px 0 0 8px;
      }
      .child-list label {
        padding-left: 8px;
      }
      .is-disabled {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h2>Better Xitter</h2>
    <div id="root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
